services:
  hodler-bot:
    build:
      context: .
      args:
        # Базовые образы: зеркало Google (нет лимита Docker Hub). Своё — DOCKER_REGISTRY в .env
        REGISTRY: ${DOCKER_REGISTRY:-mirror.gcr.io/library}
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    container_name: hodler-doc-bot
    restart: unless-stopped
    init: true                    # tini как PID 1: собирает «осиротевшие» процессы LibreOffice
    env_file: .env
    environment:
      - TZ=${TZ:-Europe/Moscow}   # «сегодня» в датах сделок и отчётах; своё значение — TZ в .env
    volumes:
      - ./data:/app/data          # БД (та же hodler.db, что у Python-версии) и сгенерированные файлы
      - ./templates:/app/templates # Шаблоны DOCX
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
