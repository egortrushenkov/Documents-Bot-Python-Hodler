services:
  hodler-bot:
    build: .
    container_name: hodler-doc-bot
    restart: unless-stopped
    init: true                    # tini как PID 1: собирает «осиротевшие» процессы LibreOffice
    env_file: .env
    volumes:
      - ./data:/app/data          # БД и сгенерированные файлы
      - ./templates:/app/templates # Шаблоны DOCX
    environment:
      - PYTHONUNBUFFERED=1
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
